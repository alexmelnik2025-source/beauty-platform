# Local development services. Start: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: beauty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty_local_dev # local-only password, never used outside this machine
      POSTGRES_DB: beauty
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beauty -d beauty']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
