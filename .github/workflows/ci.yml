name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beauty
          POSTGRES_PASSWORD: beauty_ci
          POSTGRES_DB: beauty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beauty -d beauty_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://beauty:beauty_ci@localhost:5432/beauty_test?schema=public
      TEST_DATABASE_URL: postgresql://beauty:beauty_ci@localhost:5432/beauty_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: .github/scripts/run.sh pnpm install --frozen-lockfile

      - name: Format check
        run: .github/scripts/run.sh pnpm format:check

      - name: Lint
        run: .github/scripts/run.sh pnpm lint

      - name: Typecheck
        run: .github/scripts/run.sh pnpm typecheck

      - name: Build
        run: .github/scripts/run.sh pnpm build

      - name: Test (real PostgreSQL)
        run: SUMMARY=1 .github/scripts/run.sh pnpm test
