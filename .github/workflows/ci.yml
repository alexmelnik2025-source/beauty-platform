name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beauty
          POSTGRES_PASSWORD: beauty_ci
          POSTGRES_DB: beauty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beauty -d beauty_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://beauty:beauty_ci@localhost:5432/beauty_test?schema=public
      TEST_DATABASE_URL: postgresql://beauty:beauty_ci@localhost:5432/beauty_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            .github/scripts/run.sh pnpm install --frozen-lockfile
          else
            .github/scripts/run.sh pnpm install --no-frozen-lockfile
          fi

      - name: Commit generated lockfile (first run only)
        if: hashFiles('pnpm-lock.yaml') != '' && github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: add pnpm-lock.yaml generated by CI"
            git push
          fi

      - name: Format check
        run: .github/scripts/run.sh pnpm format:check

      - name: Lint
        run: .github/scripts/run.sh pnpm lint

      - name: Typecheck
        run: .github/scripts/run.sh pnpm typecheck

      - name: Build
        run: .github/scripts/run.sh pnpm build

      - name: Test (real PostgreSQL)
        run: .github/scripts/run.sh pnpm test
